name: Judge checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Verify a clean source checkout
        run: |
          npm ci
          npm test
          npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify production UI using isolated fictional fixtures
        run: |
          node tests/browser-bee.mjs
          node tests/browser-save-race.mjs
          node tests/browser-operation-race.mjs
