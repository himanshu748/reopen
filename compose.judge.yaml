name: reopen-judge
services:
  app:
    build: .
    environment:
      APP_ORIGIN: https://localhost:8443
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4333'
      DATA_PATH: /app/data/reopen.sqlite
    volumes:
      - reopen-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ./deploy/Caddyfile.judge:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  reopen-data:
  caddy-data:
  caddy-config:
